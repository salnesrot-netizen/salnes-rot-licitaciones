<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALNÉS ROT · Licitaciones</title><style>
:root{--y:#ffd400;--k:#111}*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f5f6;color:#111}header{background:#111;color:white;border-bottom:6px solid var(--y);padding:18px 22px}.w{max-width:1450px;margin:auto;padding:16px}.bar,.stats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.btn{padding:11px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#111;text-decoration:none;font-weight:700}.yellow{background:var(--y);border-color:var(--y)}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:14px}.stat{min-width:160px}.stat b{font-size:21px;display:block}.small{font-size:12px;color:#666}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-bottom:12px}input,select{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}table{width:100%;border-collapse:collapse;background:white}th{background:#111;color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #eee;vertical-align:top}.tag{display:inline-block;padding:4px 7px;border-radius:12px;font-size:11px;font-weight:700;background:#fff0a6}.aena{background:#dbeafe}.empty{text-align:center;padding:35px;color:#666}@media(max-width:800px){.filters{grid-template-columns:1fr}.scroll{overflow:auto}table{min-width:1050px}}</style></head>
<body><header><h1 style="margin:0">SALNÉS ROT · BUSCADOR DE LICITACIONES</h1><div>AENA · actualización automática diaria</div></header><div class="w">
<div class="bar"><a class="btn yellow" href="https://contratacion.aena.es/contratacion/principal?portal=licitaciones" target="_blank">AENA OFICIAL</a><a class="btn" href="https://contrataciondelsectorpublico.gob.es/wps/portal/inicio" target="_blank">PLACSP</a><a class="btn" href="https://elicita.aena.es/SLE_Internet" target="_blank">ELICITA</a></div>
<div class="stats"><div class="card stat"><span class="small">Licitaciones AENA</span><b id=n>0</b></div><div class="card stat"><span class="small">Recomendadas</span><b id=nr>0</b></div><div class="card stat"><span class="small">Última actualización</span><b id=up style="font-size:14px">—</b></div></div>
<div class="card filters"><input id=q placeholder="Buscar: vinilo, señalética, impresión..." oninput=render()><select id=f onchange=render()><option value="">Todas</option><option value="rec">Recomendadas SALNÉS ROT</option></select><select id=s onchange=render()><option value="">Cualquier destino</option><option value="gal">Galicia</option><option value="mad">Madrid</option></select></div>
<div class="card scroll" style="padding:0"><table><thead><tr><th>Interés</th><th>Expediente / objeto</th><th>Destino</th><th>Importe neto</th><th>Publicación</th><th>Fecha límite</th><th>Expediente</th></tr></thead><tbody id=rows><tr><td colspan=7 class=empty>Cargando datos…</td></tr></tbody></table></div></div>
<script>
let D=[];const K=['rotul','señal','cartel','vinil','impres','corporea','corpórea','placa','lona','pictograma','fotolumin','metacril','alupanel','serigraf','dtf','material promocional','vestuario laboral','ropa laboral','imagen corporativa'];const N=x=>(x||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const T=x=>N(JSON.stringify(x));const rec=x=>K.some(k=>T(x).includes(N(k)));function render(){let z=N(q.value),ff=f.value,ss=s.value;let a=D.filter(x=>(!z||T(x).includes(z))&&(!ff||rec(x))&&(!ss||(ss==='gal'&&/(vigo|santiago|coru|galicia)/.test(T(x)))||(ss==='mad'&&/madrid|barajas/.test(T(x)))));n.textContent=a.length;nr.textContent=D.filter(rec).length;rows.innerHTML=a.length?a.map(x=>`<tr><td>${rec(x)?'<span class=tag>RECOMENDADA</span>':''}</td><td><b>${x.id||''}</b><br>${x.title||''}</td><td>${x.place||''}</td><td>${x.amount||'—'}</td><td>${x.published||'—'}</td><td>${x.deadline||'—'}</td><td>${x.url?`<a target=_blank href="${x.url}">Abrir</a>`:'—'}</td></tr>`).join(''):'<tr><td colspan=7 class=empty>Sin resultados.</td></tr>'}
fetch('datos.json?'+Date.now()).then(r=>r.json()).then(o=>{D=o.items||[];up.textContent=o.updated||'—';render()}).catch(()=>{rows.innerHTML='<tr><td colspan=7 class=empty>Aún no se ha ejecutado la primera actualización.</td></tr>'})
</script></body></html>
